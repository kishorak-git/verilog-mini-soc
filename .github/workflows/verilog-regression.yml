name: Verilog Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Windows Icarus Verilog regression
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        shell: powershell
        run: |
          choco install iverilog --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = @($machinePath, $userPath) -join ";"

          $iverilogCommand = Get-Command "iverilog.exe" -ErrorAction SilentlyContinue
          $vvpCommand = Get-Command "vvp.exe" -ErrorAction SilentlyContinue
          if (-not $iverilogCommand) {
            throw "Icarus Verilog executable 'iverilog.exe' was not found on PATH"
          }
          if (-not $vvpCommand) {
            throw "Icarus Verilog executable 'vvp.exe' was not found on PATH"
          }

          $iverilogDir = Split-Path -Parent $iverilogCommand.Source
          $vvpDir = Split-Path -Parent $vvpCommand.Source
          if ($iverilogDir -ne $vvpDir) {
            throw "iverilog.exe and vvp.exe resolved to different directories"
          }

          $iverilogDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "iverilog: $($iverilogCommand.Source)"
          Write-Host "vvp:      $($vvpCommand.Source)"

      - name: Compile top-level Mini SoC
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\compile_soc.ps1
          exit $LASTEXITCODE

      - name: Run complete automated regression
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_all_tests.ps1
          exit $LASTEXITCODE

      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-soc-verification-results
          path: simulation/results.txt
          if-no-files-found: warn
