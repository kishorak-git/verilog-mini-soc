name: Verilog Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Windows Icarus Verilog regression
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        shell: powershell
        run: |
          choco install iverilog --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $Iverilog = Get-Command iverilog.exe -ErrorAction SilentlyContinue
          $Vvp = Get-Command vvp.exe -ErrorAction SilentlyContinue
          if (-not $Iverilog) {
            throw "Icarus Verilog installation did not provide iverilog.exe on PATH"
          }
          if (-not $Vvp) {
            throw "Icarus Verilog installation did not provide vvp.exe on PATH"
          }
          $IverilogDir = Split-Path -Parent $Iverilog.Source
          $VvpDir = Split-Path -Parent $Vvp.Source
          echo $IverilogDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if ($VvpDir -ne $IverilogDir) {
            echo $VvpDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Compile top-level Mini SoC
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\compile_soc.ps1
          exit $LASTEXITCODE

      - name: Run complete automated regression
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_all_tests.ps1
          exit $LASTEXITCODE

      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-soc-verification-results
          path: simulation/results.txt
          if-no-files-found: warn
